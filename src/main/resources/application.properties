nana.auth.header-name=X-Authentik-Username
nana.auth.fallback-username=unknown
nana.annas-archive.mirror-url=https://annas-archive.gl
nana.annas-archive.secret-key=
nana.annas-archive.max-domain-index=${ANNAS_ARCHIVE_MAX_DOMAIN_INDEX:2}
nana.download.directory=${NANA_DOWNLOAD_DIR:${java.io.tmpdir}/nana/downloads}
nana.download.timeout=5M
nana.webhook.enabled=false
nana.webhook.url=

quarkus.rest-client.annasarchive.url=${nana.annas-archive.mirror-url}
quarkus.rest-client.annasarchive.scope=jakarta.inject.Singleton
quarkus.rest-client.annasarchive.follow-redirects=true

quarkus.rest-client.webhook.url=http://localhost
quarkus.rest-client.webhook.read-timeout=10000

# ===== Downloads =====
%test.nana.download.directory=${java.io.tmpdir}/nana-test/downloads

# ===== Database (PostgreSQL; dev + test use Dev Services) =====
quarkus.datasource.db-kind=postgresql
quarkus.flyway.migrate-at-start=true
# Tests reset the database with flyway.clean() + migrate() between test classes.
%test.quarkus.flyway.clean-disabled=false
quarkus.hibernate-orm.schema-management.strategy=validate

# ===== OpenAPI =====
quarkus.swagger-ui.enabled=true
quarkus.smallrye-openapi.store-schema-directory=src/main/webui/openapi

# ===== Quinoa (frontend) =====
quarkus.quinoa.ui-dir=src/main/webui
quarkus.quinoa.build-dir=dist
quarkus.quinoa.package-manager-install=false
quarkus.quinoa.enable-spa-routing=true
quarkus.quinoa.dev-server.port=5173
%test.quarkus.quinoa=false

# ===== ArC =====
# Work around an intermittent NPE in Quarkus' unused-bean removal during @QuarkusTest augmentation
# (io.quarkus.arc.processor.UnusedBeans#findRemovableBeans); tests don't need bean trimming. Prod /
# native keep the default (all) so the image stays optimized.
%test.quarkus.arc.remove-unused-beans=none

# ===== Coverage (quarkus-jacoco, test-scoped) =====
# The Maven jacoco agent writes plain-unit-test coverage to the same data file.
%test.quarkus.jacoco.reuse-data-file=true

# ===== Container image (built & pushed by quarkus-container-image-docker) =====
quarkus.container-image.registry=ghcr.io
quarkus.container-image.group=lucas-dclrcq
quarkus.container-image.name=nana
quarkus.container-image.additional-tags=latest

# ===== Log =====
quarkus.log.level=INFO
