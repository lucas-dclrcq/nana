# ===== Authentication (trusted reverse-proxy header, e.g. Authentik forward auth) =====
nana.auth.header-name=${NANA_AUTH_HEADER_NAME:X-Authentik-Username}
%dev.nana.auth.fallback-username=dev

# ===== Anna's Archive =====
# Downloads require a paid membership "secret key" (annas-archive.org account page);
# search works without it. Set ANNAS_ARCHIVE_KEY to enable downloads.
nana.annas-archive.mirror-url=${ANNAS_ARCHIVE_MIRROR_URL:https://annas-archive.org}
nana.annas-archive.secret-key=${ANNAS_ARCHIVE_KEY:}
nana.annas-archive.max-domain-index=${ANNAS_ARCHIVE_MAX_DOMAIN_INDEX:5}
quarkus.rest-client.annasarchive.url=${nana.annas-archive.mirror-url}
quarkus.rest-client.annasarchive.scope=jakarta.inject.Singleton

# ===== Downloads =====
nana.download.directory=${NANA_DOWNLOAD_DIR:${java.io.tmpdir}/nana/downloads}
nana.download.timeout=5M
%test.nana.download.directory=${java.io.tmpdir}/nana-test/downloads

# ===== Webhooks =====
nana.webhook.enabled=${NANA_WEBHOOK_ENABLED:false}
nana.webhook.url=${NANA_WEBHOOK_URL:}

# ===== Database (PostgreSQL; dev + test use Dev Services) =====
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${DB_JDBC_URL}
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}

# Flyway owns the schema; Hibernate only validates that it matches the entity mappings.
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate

# ===== OpenAPI (schema stored for the Orval client generation) =====
quarkus.smallrye-openapi.store-schema-directory=src/main/webui/openapi

# ===== Quinoa (frontend) =====
quarkus.quinoa.ui-dir=src/main/webui
quarkus.quinoa.build-dir=dist
quarkus.quinoa.package-manager-install=false
quarkus.quinoa.enable-spa-routing=true
quarkus.quinoa.dev-server.port=5173
%test.quarkus.quinoa=false

# ===== Log =====
quarkus.log.level=INFO
