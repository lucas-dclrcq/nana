name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: src/main/webui/package-lock.json

      - name: Verify (JVM) — pull requests
        if: github.event_name == 'pull_request'
        run: ./mvnw -B verify

      - name: Install Playwright Chromium — push to main
        if: github.event_name == 'push'
        run: ./mvnw -B -q test-compile exec:java -Dexec.classpathScope=test -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium"

      - name: Verify native (+ container image via quarkus-container-image-docker, runs E2E IT) — push to main
        if: github.event_name == 'push'
        run: ./mvnw -B verify -Dnative

  coverage:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: src/main/webui/package-lock.json

      - name: Verify (JVM, JaCoCo)
        run: ./mvnw -B verify

      - name: Generate coverage badge
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: target/jacoco-report/jacoco.csv
          badges-directory: .github/badges

      - name: Commit coverage badge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges/jacoco.svg
          if ! git diff --staged --quiet; then
            git commit -m "chore: update coverage badge"
            git pull --rebase origin main
            git push
          fi
