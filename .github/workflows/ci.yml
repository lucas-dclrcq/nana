name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: src/main/webui/package-lock.json

      - name: Verify (JVM) — pull requests
        if: github.event_name == 'pull_request'
        run: ./mvnw -B verify

      - name: Verify native + build image — push to main
        if: github.event_name == 'push'
        run: |
          ./mvnw -B verify -Dnative
          docker build -f src/main/docker/Dockerfile.native -t nana:${{ github.sha }} .
